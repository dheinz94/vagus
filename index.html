<style>
/* Layout: mobile-first Instrumententafel – Kopfzeile oben, Karten in einer Spalte, Tab-Leiste unten; ab 900px zwei Spalten.
   Design "Nacht" (Standard, dunkel). Hell-Variante "Papier" folgt dem System; weitere Designs über data-skin. */
:root {
  --bg: #0d1215; --surface: #151c20; --surface-2: #1c252a; --line: #27323a;
  --ink: #ecf1f2; --ink-2: #a7b4ba; --ink-3: #75848b;
  --accent: #8fd0e8; --on-accent: #0b1013;
  --good: #2fbf71; --warn: #f2b42c; --bad: #e25a4c;
  --strain: #3d8fe8; --sleep: #9a8cf0; --age: #3cc2a0;
  --younger: #3d8fe8; --older: #e25a4c; --neutral: #3a464d;
  --st-light: #b8b1f3; --st-rem: #8d81ea; --st-deep: #5f52d9; --st-awake: #5b6970;
  --grid: rgba(167,180,186,.12);
  --f-display: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --f-body: 'Instrument Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-num: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --num-stretch: 112%;
  --r: 18px; --r-s: 10px;
  --shadow: 0 6px 24px rgb(0 0 0 / .25); --shadow-s: 0 1px 2px rgb(0 0 0 / .18);
  --card-border: 1px solid transparent;
  --card-bg: var(--surface);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f1f3ef; --surface: #ffffff; --surface-2: #ebeee8; --line: #d9ddd5;
    --ink: #13191b; --ink-2: #4a5458; --ink-3: #6d777b;
    --accent: #17607a; --on-accent: #ffffff;
    --good: #12924a; --warn: #b77800; --bad: #c8382f;
    --strain: #2a78d6; --sleep: #6250d6; --age: #0f8a6c;
    --younger: #2a78d6; --older: #c8382f; --neutral: #d4d8d1;
    --st-light: #a99ff0; --st-rem: #7a6de0; --st-deep: #4535b5; --st-awake: #a3adb1;
    --grid: rgba(20,25,27,.08);
    --card-border: 1px solid var(--line);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f1f3ef; --surface: #ffffff; --surface-2: #ebeee8; --line: #d9ddd5;
  --ink: #13191b; --ink-2: #4a5458; --ink-3: #6d777b;
  --accent: #17607a; --on-accent: #ffffff;
  --good: #12924a; --warn: #b77800; --bad: #c8382f;
  --strain: #2a78d6; --sleep: #6250d6; --age: #0f8a6c;
  --younger: #2a78d6; --older: #c8382f; --neutral: #d4d8d1;
  --st-light: #a99ff0; --st-rem: #7a6de0; --st-deep: #4535b5; --st-awake: #a3adb1;
  --grid: rgba(20,25,27,.08);
  --card-border: 1px solid var(--line);
  color-scheme: light;
}
/* ---- Wählbare Designs (Einstellungen → Design) ---- */
:root[data-skin="nacht"] {
  --bg: #0d1215; --surface: #151c20; --surface-2: #1c252a; --line: #27323a;
  --ink: #ecf1f2; --ink-2: #a7b4ba; --ink-3: #75848b; --accent: #8fd0e8; --on-accent: #0b1013;
  --good: #2fbf71; --warn: #f2b42c; --bad: #e25a4c; --strain: #3d8fe8; --sleep: #9a8cf0; --age: #3cc2a0;
  --younger: #3d8fe8; --older: #e25a4c; --neutral: #3a464d;
  --st-light: #b8b1f3; --st-rem: #8d81ea; --st-deep: #5f52d9; --st-awake: #5b6970; --grid: rgba(167,180,186,.12);
  --card-border: 1px solid transparent; --f-num: 'Archivo', 'Helvetica Neue', Arial, sans-serif; --r: 18px; color-scheme: dark;
}
:root[data-skin="papier"] {
  --bg: #f1f3ef; --surface: #ffffff; --surface-2: #ebeee8; --line: #d9ddd5;
  --ink: #13191b; --ink-2: #4a5458; --ink-3: #6d777b; --accent: #17607a; --on-accent: #ffffff;
  --good: #12924a; --warn: #b77800; --bad: #c8382f; --strain: #2a78d6; --sleep: #6250d6; --age: #0f8a6c;
  --younger: #2a78d6; --older: #c8382f; --neutral: #d4d8d1;
  --st-light: #a99ff0; --st-rem: #7a6de0; --st-deep: #4535b5; --st-awake: #a3adb1; --grid: rgba(20,25,27,.08);
  --card-border: 1px solid var(--line); --f-num: 'Archivo', 'Helvetica Neue', Arial, sans-serif; --r: 14px; color-scheme: light;
}
:root[data-skin="oled"] {
  --bg: #000000; --surface: #000000; --surface-2: #0e0e0e; --line: #2b2b2b;
  --ink: #ffffff; --ink-2: #b9b9b9; --ink-3: #868686; --accent: #ffffff; --on-accent: #000000;
  --good: #2fd47c; --warn: #ffc23a; --bad: #ff5f52; --strain: #4f9dff; --sleep: #a597ff; --age: #45d6b0;
  --younger: #4f9dff; --older: #ff5f52; --neutral: #333333;
  --st-light: #c3bcff; --st-rem: #9487f2; --st-deep: #6457e0; --st-awake: #5c5c5c; --grid: rgba(255,255,255,.1);
  --card-border: 1px solid var(--line); --f-num: 'Archivo', 'Helvetica Neue', Arial, sans-serif; --num-stretch: 125%; --r: 24px; color-scheme: dark;
}
:root[data-skin="cockpit"] {
  --bg: #07111f; --surface: #0b1a2d; --surface-2: #10233b; --line: #1d3352;
  --ink: #dbe8f5; --ink-2: #8fa6bf; --ink-3: #66809c; --accent: #59d0ff; --on-accent: #04101c;
  --good: #36d27f; --warn: #ffbf3d; --bad: #ff6655; --strain: #59a8ff; --sleep: #a093ff; --age: #4fd3b3;
  --younger: #59a8ff; --older: #ff6655; --neutral: #22385a;
  --st-light: #bdb5ff; --st-rem: #8f84f0; --st-deep: #5c50d8; --st-awake: #4a6584; --grid: rgba(89,208,255,.08);
  --card-border: 1px solid var(--line); --f-num: 'JetBrains Mono', ui-monospace, Menlo, monospace; --num-stretch: 100%; --r: 4px; color-scheme: dark;
}

/* ---- Grundlagen ---- */
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; min-height: 100%; }
:root[data-skin="cockpit"] body { background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 28px 28px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.num { font-family: var(--f-num); font-stretch: var(--num-stretch); font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-3); font-weight: 600; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
p { margin: 0; }

/* ---- Rahmen ---- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 750; font-stretch: 118%; letter-spacing: .02em; font-size: 17px; flex: none; }
.brand svg { width: 24px; height: 24px; }
.datenav { display: flex; align-items: center; gap: 2px; margin-left: auto; background: var(--surface-2); border-radius: 999px; padding: 3px; min-width: 0; }
.datenav button { background: none; border: 0; padding: 6px 10px; border-radius: 999px; color: var(--ink-2); line-height: 1; }
.datenav button:disabled { opacity: .3; cursor: default; }
.datenav .dl { color: var(--ink); font-weight: 600; font-size: 13px; white-space: nowrap; padding: 6px 4px; }
.chip-sync { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 10px; font-size: 12px; color: var(--ink-2); white-space: nowrap; flex: none; }
.chip-sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
.chip-sync.ok .dot { background: var(--good); }
.chip-sync.busy .dot { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
.chip-sync.err .dot { background: var(--bad); }
.chip-sync.demo .dot { background: var(--warn); }
@keyframes pulse { 50% { opacity: .3; } }
@media (max-width: 520px) { .chip-sync .lbl { display: none; } .brand span { display: none; } }

.wrap { max-width: 1120px; margin: 0 auto; padding-block: 16px 110px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { background: none; border: 0; padding: 9px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--ink-3); font-size: 11px; font-weight: 600; letter-spacing: .02em; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] svg { color: var(--accent); }

/* ---- Karten ---- */
.card { background: var(--card-bg); border: var(--card-border); border-radius: var(--r); padding: 16px; min-width: 0; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.card-h h2 { font-size: 16px; font-weight: 650; font-stretch: 105%; }
.card-h .eyebrow { white-space: nowrap; }
.grid2 { display: grid; grid-template-columns: 1fr; gap: 14px; align-items: start; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 900px) { .grid2 { grid-template-columns: 1fr 1fr; } .span2 { grid-column: 1 / -1; } }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.wrap-row { flex-wrap: wrap; }
.divider { height: 1px; background: var(--line); margin: 4px 0; }

/* ---- Hero-Ringe ---- */
.hero3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.gauge { background: var(--card-bg); border: var(--card-border); border-radius: var(--r); padding: 14px 8px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; border-width: 1px; cursor: pointer; transition: transform .15s ease; }
.gauge:hover { transform: translateY(-1px); }
.gauge svg { width: 100%; max-width: 132px; height: auto; display: block; }
.gauge .glabel { font-size: 12px; font-weight: 650; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.gauge .gsub { font-size: 12px; color: var(--ink-3); min-height: 1.3em; }
.ring-val { font-family: var(--f-num); font-stretch: var(--num-stretch); font-weight: 720; fill: var(--ink); }
.ring-unit { font-family: var(--f-body); fill: var(--ink-3); font-weight: 600; }
.ring-track { stroke: var(--surface-2); }

/* ---- Zustände ---- */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: currentColor; }
.pill.good i { background: var(--good); } .pill.warn i { background: var(--warn); } .pill.bad i { background: var(--bad); }
.stripe { border-left: 4px solid var(--ink-3); padding-left: 12px; }
.stripe.green { border-color: var(--good); } .stripe.yellow { border-color: var(--warn); } .stripe.red { border-color: var(--bad); }
.banner { border-radius: var(--r-s); padding: 11px 14px; font-size: 13.5px; display: flex; gap: 10px; align-items: flex-start; background: color-mix(in srgb, var(--warn) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }
.banner.info { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.banner.err { background: color-mix(in srgb, var(--bad) 12%, var(--surface)); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.banner b { font-weight: 650; }
.banner .grow { flex: 1; min-width: 0; }

/* ---- Kennzahlen-Liste ---- */
.metrics { display: flex; flex-direction: column; }
.metric { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.metric:first-child { border-top: 0; padding-top: 2px; }
.metric .mv { font-family: var(--f-num); font-stretch: var(--num-stretch); font-weight: 650; font-size: 18px; text-align: right; white-space: nowrap; }
.metric .mv small { font-family: var(--f-body); font-size: 12px; color: var(--ink-3); font-weight: 500; margin-left: 2px; }
.metric .ml { min-width: 0; }
.metric .ml .t { font-weight: 600; }
.metric .ml .s { font-size: 12px; color: var(--ink-3); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.kv > div { background: var(--surface-2); border-radius: var(--r-s); padding: 10px 12px; min-width: 0; }
.kv .v { font-family: var(--f-num); font-stretch: var(--num-stretch); font-size: 20px; font-weight: 680; font-variant-numeric: tabular-nums; }
.kv .v small { font-family: var(--f-body); font-size: 12px; color: var(--ink-3); font-weight: 500; margin-left: 2px; }
.kv .l { font-size: 12px; color: var(--ink-3); margin-top: 2px; }

/* ---- Balken ---- */
.hbar { height: 12px; border-radius: 6px; background: var(--surface-2); overflow: hidden; display: flex; gap: 2px; }
.hbar > span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); margin-top: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.contrib { display: grid; grid-template-columns: minmax(96px, 1.2fr) 2fr auto; align-items: center; gap: 10px; padding: 7px 0; }
.contrib .bar { position: relative; height: 10px; background: var(--surface-2); border-radius: 5px; }
.contrib .bar::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--ink-3); }
.contrib .bar span { position: absolute; top: 0; bottom: 0; border-radius: 5px; }
.contrib .val { font-family: var(--f-num); font-stretch: var(--num-stretch); font-variant-numeric: tabular-nums; font-size: 13px; min-width: 64px; text-align: right; }

/* ---- Liste ---- */
.list { display: flex; flex-direction: column; }
details.act { border-top: 1px solid var(--line); padding: 0; }
details.act:first-child { border-top: 0; }
details.act > summary.li { border-top: 0; }
details.act > summary::-webkit-details-marker { display: none; }
details.act[open] > summary .tt::after { content: " ▾"; color: var(--ink-3); }
.li { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; }
.li .ic { width: 36px; height: 36px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; color: var(--ink-2); }
.li .ic svg { width: 20px; height: 20px; }
.li .tt { font-weight: 600; }
.li .ss { font-size: 12.5px; color: var(--ink-3); }
.li .rv { text-align: right; }
.li .rv .num { font-weight: 680; font-size: 18px; }
.menu-li { width: 100%; background: none; border: 0; text-align: left; padding: 13px 0; }

/* ---- Bedienelemente ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 10px 18px; font-weight: 650; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); text-decoration: none; font-size: 14px; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 7px 13px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chipbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: 13px; color: var(--ink-2); }
.chipbtn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 650; box-shadow: var(--shadow-s); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.field input, .field select, .field textarea { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-s); padding: 10px 12px; width: 100%; min-width: 0; }
.field .hint { font-size: 12px; color: var(--ink-3); }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
details { border-top: 1px solid var(--line); padding: 10px 0; }
details summary { cursor: pointer; font-weight: 600; }
pre.raw { white-space: pre-wrap; word-break: break-word; background: var(--surface-2); padding: 12px; border-radius: var(--r-s); font-family: var(--f-mono); font-size: 12px; max-height: 300px; overflow: auto; margin: 8px 0 0; }
.table-wrap { overflow-x: auto; }
table.t { border-collapse: collapse; width: 100%; font-size: 13.5px; }
table.t th, table.t td { padding: 8px 6px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t td.wrapcell { white-space: normal; word-break: break-all; }
table.t thead th { border-top: 0; color: var(--ink-3); font-weight: 600; font-size: 12px; }
.up { color: var(--good); } .down { color: var(--bad); }
.progress { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--accent); transition: width .3s ease; }

/* ---- Diagramme ---- */
.chart { position: relative; width: 100%; min-height: 40px; }
.chart svg { display: block; overflow: visible; }
.ax { font-family: var(--f-body); font-size: 11px; fill: var(--ink-3); }
.gridl { stroke: var(--grid); stroke-width: 1; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); border: 1px solid var(--line); color: var(--ink); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; box-shadow: var(--shadow); max-width: 240px; }
.tip b { font-family: var(--f-num); font-stretch: var(--num-stretch); }

  const last31 = A.dates.filter(d => d > addDays(end, -31));
  const daysWith = last31.filter(d => { const x = (S.days || {})[d] || {}; return x.sleep || isNum(x.hrv) || isNum(x.rhr); }).length;
  const unlocked = daysWith >= 21;
  const long = healthspanWindow(S, A, end, 180);
  const short = healthspanWindow(S, A, end, 30);
  const age = A.P.age;
  let pace = null;
  // Tempo nur, wenn der Langzeitwert deutlich mehr Daten hat als die letzten 30 Tage
  if (long && short && long.nDays - short.nDays >= 14) pace = clamp(1 + 2 * (short.delta - long.delta), -1, 3);
  // wöchentlicher Verlauf
  const hist = [];
  const keySet = long ? long.metrics.filter(m => isNum(m.years)).map(m => m.key).join(',') : '';
  if (unlocked) {
    for (let w = 25; w >= 0; w--) {
      const e = addDays(end, -7 * w);
      if (e < A.dates[0]) continue;
      const h = healthspanWindow(S, A, e, 180);
      if (!h || h.metrics.filter(m => isNum(m.years)).map(m => m.key).join(',') !== keySet) continue; // nur vergleichbare Punkte
      const nd = A.dates.filter(d => d <= e && d > addDays(e, -31)).filter(d => { const x = (S.days || {})[d] || {}; return x.sleep || isNum(x.hrv) || isNum(x.rhr); }).length;
      if (h && nd >= 21 && age != null) hist.push({ date: e, bioAge: ageOn(S.profile.birthday, e) != null ? ageOn(S.profile.birthday, e) + h.delta : age + h.delta });
    }
  }
  return { unlocked, daysWith, long, short, pace, age, bioAge: age != null && long ? age + long.delta : null, hist };
}

async function readRpc(res) {

    const events = []; let cur = [];
    for (const line of raw.split(/\r?\n/)) {
      if (!line) { if (cur.length) { events.push(cur.join('\n')); cur = []; } continue; }
      if (line.startsWith('data:')) cur.push(line.slice(5).replace(/^ /, ''));
    }
    if (cur.length) events.push(cur.join('\n'));
    for (let i = events.length - 1; i >= 0; i--) { try { const j = JSON.parse(events[i]); if (j && (j.result || j.error)) return j; } catch (e) { } }
    return events.length ? JSON.parse(events[events.length - 1]) : {};
  }
  return JSON.parse(raw);
}

  app.syncing = true; app.conn = { state: 'syncing' };

  const sections = {};
  const steps = [

    ['Trainingsplan', fetchSchedule],
    ['Stressverlauf', fetchStressTs],
    ['COROS-Erholung', fetchRecovery],
    ['Fitness', fetchFitness],
    ['Trainingslast', fetchLoad],
    ['Aktivitäten', () => fetchActivities(span)],
    ['Aktivitätsdetails', () => fetchDetails(hist ? 60 : first ? 25 : 12)]
  ];
  try {

/* ---------- Schlafphasen-Übersicht (Tag / Woche / Monat / Jahr) ---------- */
const SD_STAGES = [['awake', 'wach'], ['rem', 'REM'], ['light', 'Leicht'], ['deep', 'Tief']];
const MONTHS = ['Jänner', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
/** Eine Nacht in einheitliche Minuten zerlegen (COROS-Anteile beziehen sich auf die Gesamtzeit inkl. Wachzeit) */
function sdNight(sl) {
  if (!sl || !isNum(sl.mainMin)) return null;
  const period = isNum(sl.periodMin) ? sl.periodMin : sl.mainMin + (isNum(sl.awakeMin) ? sl.awakeMin : 0);
  const m = {};
  const ps = ['deep', 'light', 'rem'].map(k => sl[k + 'Pct']);
  for (const [k] of SD_STAGES) {
    if (k === 'awake') { m[k] = isNum(sl.awakeMin) ? sl.awakeMin : isNum(sl.awakePct) ? sl.awakePct / 100 * period : null; continue; }
    // Schlafphasen teilen sich die Schlafzeit im Verhältnis der COROS-Prozente
    m[k] = ps.every(isNum) && sum(ps) > 0 ? sl[k + 'Pct'] / sum(ps) * sl.mainMin : isNum(sl[k + 'Min']) ? sl[k + 'Min'] : null;
  }
  if (!SD_STAGES.every(([k]) => isNum(m[k]))) return null;
  return { asleep: sl.mainMin, period, m, score: sl.score, start: sl.start, end: sl.end, awakeCount: sl.awakeCount, napMin: sl.napMin };
}
/** Mittelwerte über mehrere Nächte; Anteile wie bei COROS aus der Summe der Phasen */
function sdAgg(dates) {
  const ns = dates.map(d => sdNight(((app.S.days[d] || {}).sleep))).filter(Boolean);
  if (!ns.length) return null;
  const out = { n: ns.length, asleep: mean(ns.map(x => x.asleep)), period: mean(ns.map(x => x.period)), m: {}, pct: {}, score: mean(ns.map(x => x.score)) };
  const tot = {}; let all = 0;
  for (const [k] of SD_STAGES) { const v = ns.map(x => x.m[k]); out.m[k] = mean(v); tot[k] = sum(v); all += tot[k]; }
  for (const [k] of SD_STAGES) out.pct[k] = all ? tot[k] / all * 100 : null;
  return out;
}
function sdPeriod(mode, anchor) {
  const a = dateOf(anchor);
  if (mode === 'W') { const wd = (a.getDay() + 6) % 7; const s = addDays(anchor, -wd); return { start: s, end: addDays(s, 6), label: fDM(s) + ' – ' + fDM(addDays(s, 6)), prevLabel: 'Ø Vorwoche' }; }
  if (mode === 'M') { const s = ymd(new Date(a.getFullYear(), a.getMonth(), 1, 12)); const e = ymd(new Date(a.getFullYear(), a.getMonth() + 1, 0, 12)); return { start: s, end: e, label: MONTHS[a.getMonth()] + ' ' + a.getFullYear(), prevLabel: 'Ø Vormonat' }; }
  if (mode === 'J') { const y = a.getFullYear(); return { start: y + '-01-01', end: y + '-12-31', label: String(y), prevLabel: 'Ø Vorjahr' }; }
  return { start: anchor, end: anchor, label: relDay(anchor), prevLabel: '7-Tage-Ø' };
}
function sdShift(mode, anchor, dir) {
  const a = dateOf(anchor);

  if (mode === 'M') return ymd(new Date(a.getFullYear(), a.getMonth() + dir, 1, 12));

      const s30 = S30[m.key]; const tr = m.input !== 'manual' && s30 && isNum(s30.value) && isNum(m.value) && isNum(s30.years) && isNum(m.years) ? (s30.years < m.years - 0.05 ? '<span class="up">▲ besser</span>' : s30.years > m.years + 0.05 ? '<span class="down">▼ schwächer</span>' : '<span class="faint">→ stabil</span>') : '';

  h += card(`Die ${L.metrics.length} Faktoren`, groups + `<div class="legend"><span><i style="background:var(--younger)"></i>macht jünger</span><span><i style="background:var(--older)"></i>macht älter</span><span><span class="srcchip coros">gemessen</span> ${nM} von COROS</span><span><span class="srcchip man">eingetragen</span> ${nE} von dir</span></div>`, { right: '6 Monate · Trend 30 Tage' });

}

async function coachSend(text) {
  text = String(text || '').trim(); if (!text || app.chatBusy) return;
  const sample = app.caps.sample;
  app.chat.push({ role: 'user', content: text });
  if (!sample) { app.chat.push({ role: 'assistant', content: 'Der KI-Coach funktioniert nur, wenn Vagus in Claude geöffnet ist (claude.ai oder Claude-App).' }); render(); return; }
  app.chat.push({ role: 'assistant', content: 'Denkt nach …' }); app.chatBusy = true; render();
  const ctl = new AbortController(); app.chatCtl = ctl;
  const turns = [{ role: 'user', content: coachContext() }, ...app.chat.slice(0, -1).slice(-12)];
  try {
    const res = await sample(turns, { cache: false, signal: ctl.signal, onText: ({ text }) => { app.chat[app.chat.length - 1].content = text; const el = $('#coachLive'); if (el) el.textContent = text; } });
    app.chat[app.chat.length - 1].content = res.text + (res.truncated ? '\n\n(Antwort gekürzt)' : '');
  } catch (e) {
    const last = app.chat[app.chat.length - 1];
    if (e && e.code === 'cancelled') last.content = (e.text || '') + (e.text ? '\n\n(gestoppt)' : '(gestoppt)');
    else last.content = (e && e.text ? e.text + '\n\n' : '') + (SAMPLE_COPY[e && e.code] || SAMPLE_COPY.upstream_error);
  } finally { app.chatBusy = false; app.chatCtl = null; render(); const c = $('#chat'); if (c) c.lastElementChild && c.lastElementChild.scrollIntoView({ block: 'nearest' }); }
}

/** Nach der Einrichtung: Schlüssel in Claude privat sichern, damit andere Claude-Geräte ihn kennen */
async function onSyncConfigured(cfg) {
  if (store.db && cfg && cfg.mode === 'mcp') { try { await store.col().doc('sync').set({ cfg: { mode: 'mcp', raw: cfg.raw, salt: cfg.salt } }); } catch (e) { } }
}
function onSyncMerged() { store.soon(); recompute(); render(); }
async function importFile(file) {
  const msg = $('#expMsg');
  try {
    const d = JSON.parse(await file.text());
    if (!d || typeof d !== 'object' || !(d.days || d.journal || d.acts)) throw new Error('kein Vagus-Export');
    const R = app.real; let n = 0;
    for (const [k, v] of Object.entries(d.days || {})) if (v && (!R.days[k] || (v._at || 0) > (R.days[k]._at || 0))) { R.days[k] = v; store.markDay(k); n++; }
    for (const [k, v] of Object.entries(d.acts || {})) if (v && v.date && (!R.acts[k] || (v._at || 0) > (R.acts[k]._at || 0))) { R.acts[k] = v; store.markDay(v.date); }
    for (const [k, v] of Object.entries(d.journal || {})) if (v && (!R.journal[k] || (v._at || 1) > (R.journal[k]._at || 0))) { R.journal[k] = Object.assign({ _at: 1 }, v); store.markJournal(k); n++; }
    const P = R.profile; const dp = d.profile || {}; const man = dp._manual || {};
    for (const k of Object.keys(man)) if (man[k] && !(P._manual || {})[k] && dp[k] != null) { P[k] = dp[k]; P._manual = Object.assign({}, P._manual, { [k]: true }); P._ts = Object.assign({}, P._ts, { [k]: (dp._ts || {})[k] || Date.now() }); }
    store.mark('profile'); await store.flush(); Sync.soon(500); recompute(); render();
    const m2 = $('#expMsg'); if (m2) m2.textContent = 'Import abgeschlossen: ' + n + ' Tage und Tagebucheinträge übernommen.';
  } catch (e) { if (msg) msg.textContent = 'Diese Datei konnte nicht gelesen werden. Wähle eine Export-Datei von Vagus (.json).'; }
}

/* ---------- Methodik ---------- */
function viewMethodik() {
  let h = subHeader('Methodik & Quellen');
  const sec = (t, b) => `<section class="card"><h2 style="font-size:17px;margin-bottom:8px">${t}</h2><div class="small muted" style="display:flex;flex-direction:column;gap:8px;max-width:72ch">${b}</div></section>`;
  h += sec('Erholung (0–100 %)', `<p>Vagus vergleicht die nächtliche HRV deiner Uhr mit deinem eigenen 30-Tage-Schnitt (auf logarithmischer Skala, weil HRV schief verteilt ist), ebenso Ruhepuls, Schlafleistung und – wenn vorhanden – Atemfrequenz. Gewichtung: HRV 55 %, Ruhepuls 25 %, Schlaf 15 %, Atmung 5 %. Die Summe wird über eine S-Kurve auf 0–100 % abgebildet; ein durchschnittlicher Tag landet bei etwa 58 %. Grün ab 67 %, Rot bis 33 %.</p><p>Die ersten 4 Nächte mit HRV dienen der Kalibrierung.</p>`);
  h += sec('Belastung (0–21)', `<p>Jede Aktivität wird mit dem TRIMP nach Banister bewertet: Dauer × Herzfrequenzreserve × exponentieller Gewichtung. Krafttraining bekommt 60 % Aufschlag, weil der Puls die muskuläre Arbeit unterschätzt. Alltagsbewegung zählt über die Schritte. Die Summe wird logarithmisch auf 0–21 gestaucht: Jeder weitere Punkt kostet mehr Aufwand als der vorige.</p><p>Das Belastungsziel richtet sich nach der Erholung (Rot 4–10, Gelb 10–14, Grün 14–18) und sinkt um 2, wenn das Verhältnis von 7- zu 28-Tage-Last über 1,4 liegt.</p>`);
  h += sec('Schlaf', `<p>Schlafbedarf = Grundbedarf + Zuschlag für die Belastung des Vortags (bis 50 min) + Abbau von Schlafschuld der letzten 3 Nächte (bis 90 min). Schlafleistung = geschlafene Zeit ÷ Bedarf. Konsistenz bewertet die Streuung von Einschlaf- und Aufwachzeit über 4 Nächte.</p>`);
  h += sec('Bio-Alter & Alterungstempo', `<p>Zwölf Faktoren, angelehnt an WHOOP Healthspan, aber nur aus Daten, die es wirklich gibt. <b>Gemessen von COROS:</b> Schlafdauer, Schlafkonsistenz, HRV in der Nacht, Ruhepuls, Schritte, aktive Minuten (COROS-Tageswert „Exercise“), intensive Minuten (Zone 4–5 aus dem Puls jeder einzelnen Runde), Krafttraining, VO₂max und BMI (Größe und Gewicht aus deinem COROS-Profil). <b>Von dir eingetragen:</b> Alkohol (Getränke pro Tag im Tagebuch, auch rückwirkend; Tage ohne Eintrag zählen als 0) und Rauchen / Nikotin (einmal im Profil). Die HRV zählt bewusst schwächer, weil Wearable-HRV stark von Gerät und Messzeit abhängt. Für jeden Faktor liefert eine große Studie das relative Sterberisiko gegenüber einem Durchschnittswert. Dieses Risiko wird mit der Gompertz-Regel (Sterberisiko verdoppelt sich etwa alle 8 Jahre) in Lebensjahre umgerechnet. Weil die Faktoren sich überschneiden, zählt die Summe zu 60 %.</p><p>Das Bio-Alter nutzt 6 Monate. Das Alterungstempo vergleicht die letzten 30 Tage damit: 1× heißt Kalendertempo, 0× heißt Stillstand, negative Werte heißen, dass dein Bio-Alter gerade sinkt.</p>
    <ul style="margin:0;padding-left:18px">${HS_METRICS.map(m => `<li><b>${esc(m.label)}</b>: ${esc(m.src)}</li>`).join('')}<li><b>VO₂max-Normwerte</b>: FRIEND-Register (Kaminsky et al., Mayo Clin Proc 2015)</li></ul>`);
  h += sec('Grenzen', `<p>Vagus ist kein Medizinprodukt. COROS misst anders als WHOOP (keine Hauttemperatur, HRV nur nachts), deshalb sind die Zahlen nicht direkt mit einem WHOOP-Konto vergleichbar. Für die intensiven Minuten im Bio-Alter nutzt Vagus nur echte Rundendaten (Ø-Puls je Runde, Zonen ab 50/60/70/80/90 % der max. Herzfrequenz). Aktivitäten ohne Rundendaten zählen nicht mit und werden auch nicht hochgerechnet. Fehlen Runden bei mehr als 20 % deiner Ausdauerzeit, bleibt der Faktor leer. Hat eine Aktivität nur eine einzige Runde, zählt ihr Durchschnittspuls für die ganze Dauer; harte Intervalle werden dadurch unterschätzt. Der BMI unterscheidet nicht zwischen Muskeln und Fett.</p>`);
  return h;
}

/* ---------- Ereignisse ---------- */
document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, v = t.dataset.v;
  switch (a) {
    case 'tab': go(v); break;
    case 'sub': openSub(v); break;
    case 'back': app.sub = null; app.view = 'mehr'; setHash('mehr'); render(); break;
    case 'scroll': { const el = document.getElementById(v); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); break; }
    case 'sdmode': app.sleepMode = v; if (v !== 'T') app.sleepAnchor = app.date; saveUi(); render(); break;
    case 'sdshift': { const mo = app.sleepMode || 'T'; const nd = sdShift(mo, sdPeriod(mo, app.sleepAnchor || app.date).start, +v); if (nd <= todayStr()) { app.sleepAnchor = nd; render(); } break; }
    case 'day': { const nd = addDays(app.date, +v); if (nd <= todayStr()) { app.date = nd; render(); } break; }
    case 'sync': sync('quick'); break;
    case 'history': sync('history'); break;
    case 'perms': try { await app.caps.perms.manage(); } catch (e) { } break;
    case 'jtoggle': {
      const d = t.dataset.d; const J = (usingDemo() ? app.demo : app.real).journal; const e = J[d] || (J[d] = { items: {}, note: '' });
      e.items = Object.assign({}, e.items); e.items[v] = !(e.items[v] === true); e._at = Date.now();
      if (v === 'alcohol') e.drinks = e.items.alcohol ? Math.max(1, drinksOf(e)) : 0;
      if (!usingDemo()) { store.markJournal(d); store.soon(); Sync.soon(); }
      recompute(); render(); break;
    }
    case 'jdate': app.journalDate = v; render(); break;
    case 'drinks': {
      const d = t.dataset.d; const J = (usingDemo() ? app.demo : app.real).journal; const e = J[d] || (J[d] = { items: {}, note: '' });
      e.drinks = clamp(drinksOf(e) + (+v), 0, 30); e.items = Object.assign({}, e.items, { alcohol: e.drinks > 0 }); e._at = Date.now();
      if (!usingDemo()) { store.markJournal(d); store.soon(); Sync.soon(); }
      recompute(); render(); break;
    }
    case 'trendMetric': app.trend.metric = v; saveUi(); render(); break;
    case 'trendRange': app.trend.range = +v; saveUi(); render(); break;
    case 'skin': app.skin = v; saveUi(); render(); break;
    case 'demo': app.demoPref = v; saveUi(); recompute(); render(); break;
    case 'strength': {
      const P = app.real.profile; const c = +v; const s = new Set(P.strengthCodes || [402]);
      s.has(c) ? s.delete(c) : s.add(c); P.strengthCodes = [...s]; P._manual = Object.assign({}, P._manual, { strengthCodes: true }); P._ts = Object.assign({}, P._ts, { strengthCodes: Date.now() });
      store.mark('profile'); store.soon(); Sync.soon(); recompute(); render(); break;
    }
    case 'coachAsk': coachSend(v); break;
    case 'askClaude': askClaudeWith(v); break;
    case 'askClaudeIn': { const el = $('#coachIn'); askClaudeWith(el ? el.value : ''); break; }
    case 'corosLogin': app.loginBusy = true; render(); try { await Coros.login(); } catch (e) { app.loginBusy = false; app.conn = { state: 'error', code: (e && e.code) || 'oauth_failed', msg: e && e.message }; render(); } break;
    case 'corosLogout': Coros.logout(); app.conn = { state: 'idle' }; render(); break;
    case 'syncSetup': {
      const pass = ($('#syncPass') || {}).value || ''; const target = ($('#syncTarget') || {}).value || '';
      app.syncTarget = target; app.syncMsg = 'Richte ein …'; app.syncBusy = true; render();
      try { if (IS_STANDALONE) await Sync.setupStandalone(target, pass); else await Sync.setupClaude(pass); app.syncMsg = 'Eingerichtet. Abgleich läuft …'; render(); await Sync.run(); app.syncMsg = ''; recompute(); }
      catch (e) { app.syncMsg = (e && e.msg) || ((e && e.code) === 'server_not_connected' ? 'Der Konnektor „Vagus Sync“ ist in Claude noch nicht hinzugefügt (siehe Schritt oben).' : 'Das hat nicht geklappt. Prüfe die Adresse und versuche es erneut.'); }
      app.syncBusy = false; render(); break;
    }
    case 'syncUnlock': case 'syncReset': {
      const pass = ($('#syncPass') || {}).value || '';
      app.syncMsg = a === 'syncReset' ? 'Beginne neu …' : 'Prüfe Passwort …'; app.syncBusy = true; render();
      try { if (a === 'syncReset') await Sync.reset(pass); else await Sync.unlock(pass); app.syncMsg = ''; await Sync.run(); recompute(); }
      catch (e) { app.syncMsg = (e && e.msg) || 'Das hat nicht geklappt. Bitte erneut versuchen.'; }
      app.syncBusy = false; app.confirmReset = false; render(); break;
    }
    case 'syncResetAsk': app.confirmReset = true; render(); break;
    case 'syncResetNo': app.confirmReset = false; render(); break;
    case 'syncNow': app.syncBusy = true; render(); await Sync.run(); app.syncBusy = false; recompute(); render(); break;
    case 'syncForget': Sync.forget(); if (store.db) { try { await store.col().doc('sync').delete(); } catch (e) { } } render(); break;

    case 'delYes': Sync.forget(); if (store.db) { try { await store.col().doc('sync').delete(); } catch (e) { } } await store.wipe(); app.real = emptyState(); app.confirmDelete = false; app.toolStatus = {}; app.raw = {}; recompute(); render(); break;
    case 'export': {
      const msg = $('#expMsg');
      try { await app.caps.downloads.save({ filename: 'vagus-export-' + todayStr() + '.json', data: JSON.stringify(app.real, null, 2) }); if (msg) msg.textContent = 'Export gespeichert.'; }
      catch (e) { if (msg) msg.textContent = e && e.code === 'declined' ? 'Export abgebrochen.' : 'Export ist in dieser Ansicht nicht möglich.'; }
      break;
    }
    case 'copyDiag': {
      const txt = Object.entries(app.raw).map(([k, r]) => `### ${k}\nEingabe: ${JSON.stringify(r.input)}\n${r.error ? 'Fehler: ' + r.error + '\n' : ''}${(r.text || '').slice(0, 3000)}`).join('\n\n');
      const m = $('#copyMsg');
      try { await navigator.clipboard.writeText(txt); if (m) m.textContent = 'Kopiert.'; }
      catch (e) { const pre = document.querySelector('pre.raw'); if (pre) { const range = document.createRange(); range.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range); } if (m) m.textContent = 'Kopieren nicht möglich – Text markieren und kopieren.'; }
      break;
    }
  }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset && el.dataset.pf) {
    const k = el.dataset.pf; const P = app.real.profile; let v = el.value;
    if (['heightCm', 'weightKg', 'hrMax', 'sleepBaseMin'].includes(k)) v = v === '' ? null : parseFloat(String(v).replace(',', '.'));
    if (v === '' || v == null || (typeof v === 'number' && !isFinite(v))) delete P[k]; else P[k] = v;
    P._manual = Object.assign({}, P._manual, { [k]: true }); P._ts = Object.assign({}, P._ts, { [k]: Date.now() });
    Sync.soon();
    if (usingDemo() && k === 'wakeTime') app.demo.profile.wakeTime = v;
    store.mark('profile'); store.soon(); recompute(); render();
  }
  if (el.id === 'jnote') {
    const d = el.dataset.d; const J = (usingDemo() ? app.demo : app.real).journal; const e = J[d] || (J[d] = { items: {}, note: '' }); e.note = el.value.slice(0, 500); e._at = Date.now();
    if (!usingDemo()) { store.markJournal(d); store.soon(); Sync.soon(); }
  }
  if (el.id === 'jdatePick' && /^\d{4}-\d{2}-\d{2}$/.test(el.value) && el.value <= todayStr()) { app.journalDate = el.value; render(); }
  if (el.id === 'importFile' && el.files && el.files[0]) importFile(el.files[0]);
});
document.addEventListener('keydown', ev => {
  if (ev.target && ev.target.id === 'coachIn' && ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); const txt = ev.target.value; ev.target.value = ''; coachSend(txt); }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || app.syncing) return;
  const last = app.real.meta.lastSync || 0;
  if (app.capsReady && app.caps.mcp && (!IS_STANDALONE || Coros.loggedIn()) && last && Date.now() - last > 15 * 60000) sync('quick');
  else if (Sync.ready()) Sync.run().then(ch => { if (ch) { recompute(); render(); } });
});
let rzT = null;
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(drawCharts, 150); });

/* ---------- Start ---------- */
(async function boot() {
  loadUi();
  const local = store.loadLocal(); if (local) app.real = Object.assign(emptyState(), local);
  const hash = (location.hash || '').slice(1);
  if (TABS.some(t => t[0] === hash)) app.view = hash; else if (SUB_IDS.includes(hash)) { app.view = 'mehr'; app.sub = hash; }
  recompute(); render();
  Sync.load();
  if (IS_STANDALONE) {
    app.caps = standaloneCaps();
    const qs = new URLSearchParams(location.search);
    if (qs.get('code') && qs.get('state')) {
      try { await Coros.finish(qs); app.conn = { state: 'idle' }; app.real.meta.lastSync = app.real.meta.lastSync || 0; }
      catch (e) { app.conn = { state: 'error', code: (e && e.code) || 'oauth_failed', msg: e && e.message }; }
      try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) { }
    } else if (qs.get('error')) {
      app.conn = { state: 'error', code: 'oauth_failed', msg: qs.get('error_description') || qs.get('error') };
      try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) { }
    }
  }
  // Fähigkeiten der Claude-Umgebung
  const C = window.claude;
  if (!IS_STANDALONE && C && typeof C.use === 'function') {
    const names = ['mcp', 'db', 'user', 'sample', 'permissions', 'downloads'];
    const res = await Promise.all(names.map(n => C.use(n).catch(() => null)));
    app.caps = { mcp: res[0], db: res[1], user: res[2], sample: res[3], perms: res[4], downloads: res[5] };
  }
  app.capsReady = true;
  await store.init();
  await store.load();
  if (store.loaded || app.storeMode !== 'db') app.migrated = await store.migrate();
  // Abgleich-Schlüssel in Claude aus dem privaten Speicher holen
  if (!IS_STANDALONE && !Sync.ready() && store.db) { try { const sd = await store.col().doc('sync').get(); const c = sd.exists && sd.data() && sd.data().cfg; if (c && c.raw) Sync.save(clone(c)); } catch (e) { } }
  recompute(); render();
  if (Sync.ready()) Sync.run().then(ch => { if (ch) { recompute(); render(); } });
  if (app.caps.mcp) {
    let st = 'prompt';
    try { st = app.caps.perms ? await app.caps.perms.state('mcp:' + SERVER) : 'prompt'; } catch (e) { st = 'prompt'; }
    app.perm = st;
    const last = app.real.meta.lastSync || 0;
    // Bereits verbunden (oder Freigabe erteilt) → automatisch aktualisieren
    const known = last || app.migrated;
    if ((st === 'granted' || (known && st !== 'denied' && st !== 'unavailable')) && Date.now() - last > 15 * 60000) sync(app.real.meta.historyLoaded || !last ? 'quick' : 'history');
    else render();
  } else render();
})();
